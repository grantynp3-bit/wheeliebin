name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/WheelieBinNotifier.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WheelieBinNotifier-apk
          path: out/WheelieBinNotifier.apk

      - name: Publish/refresh "latest" release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest build
          body: >
            Automatically built from the latest commit on main.
            Download WheelieBinNotifier.apk below, transfer it to both phones,
            and install it (you'll need to allow "install from unknown sources" once).
          files: out/WheelieBinNotifier.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
